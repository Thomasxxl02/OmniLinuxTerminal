[package]
name = "omnilinux-terminal"
version = "1.0.0"
description = "OmniLinux Terminal - Multi-Distribution Linux Terminal & SysAdmin Studio powered by Tauri v2 and Rust"
authors = ["OmniLinux Team"]
edition = "2021"
license = "MIT"

[lib]
name = "omnilinux_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
specta = "2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "2.0.0-rc.25", features = ["typescript"] }

# Réseau : client SSH réel (libssh2) et SMTP (lettre, TLS rustls)
ssh2 = "0.9"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
